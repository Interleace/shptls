name: Build Windows EXE

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        pip install --no-cache-dir pyinstaller
        if (Test-Path requirements.txt) { pip install -r requirements.txt }
      shell: pwsh

    - name: Generate dummy config.json from template
      run: Copy-Item config.json.template config.json
      shell: pwsh

    - name: Build EXE
      run: |
        $APP_NAME = if ($env:APP_NAME) { $env:APP_NAME } else { "App" }
        pyinstaller --onefile --noconsole --add-data "config.json;." --name $APP_NAME --clean main.py
      shell: pwsh
      env:
        APP_NAME: ${{ github.event.repository.name }}

    - name: Upload EXE
      uses: actions/upload-artifact@v4
      with:
        name: windows-exe
        path: dist/*.exe
        retention-days: 30
