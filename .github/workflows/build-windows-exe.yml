name: Build Windows EXE

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Tags müssen vorhanden sein

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        pip install --no-cache-dir pyinstaller
        if (Test-Path requirements.txt) { pip install -r requirements.txt }
      shell: pwsh

    - name: Generate dummy config.json from template
      run: Copy-Item config.json.template config.json
      shell: pwsh

    - name: Set version from tag
      id: get_version
      run: |
        $tag = git describe --tags --abbrev=0
        echo "__version__ = '`"$tag`"'" | Out-File -Encoding utf8 version.py
        echo "version=$tag" >> $env:GITHUB_OUTPUT
      shell: pwsh

    - name: Build EXE
      run: |
        $VERSION = "${{ steps.get_version.outputs.version }}"
        $APP_NAME = "${env:APP_BASE}-$VERSION"
        pyinstaller --onefile --noconsole --add-data "config.json;." --name $APP_NAME --clean main.py
      shell: pwsh
      env:
        APP_BASE: ${{ github.event.repository.name }}

    - name: Upload EXE as Artifact
      uses: actions/upload-artifact@v4
      with:
        name: windows-exe
        path: dist/*.exe
        retention-days: 30

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.get_version.outputs.version }}
        name: Release ${{ steps.get_version.outputs.version }}
        files: dist/*.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
