name: Build Windows EXE

on:
  push:
    branches: [ main, master, ui ]
  pull_request:
    branches: [ main, master, ui ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        pip install --no-cache-dir pyinstaller
        if (Test-Path requirements.txt) { pip install -r requirements.txt }
      shell: pwsh

    - name: Generate dummy config.json from template
      run: Copy-Item config.json.template config.json
      shell: pwsh

    - name: Determine version
      id: version
      shell: pwsh
      run: |
        if (Test-Path version.txt) {
          $version = Get-Content version.txt
        } else {
          try {
            $response = Invoke-RestMethod https://api.github.com/repos/Interleace/shptls/releases/latest
            $version = $response.tag_name
          } catch {
            $version = "1.0.${{ github.run_number }}"
          }
        }
        echo "version=$version" >> $env:GITHUB_OUTPUT
        Set-Content -Path version.txt -Value $version

    - name: Build EXE
      run: |
        $VERSION = "${{ steps.version.outputs.version }}"
        $APP_NAME = "${env:APP_BASE}-v$VERSION"
        pyinstaller --onefile --noconsole --add-data "config.json;." --name $APP_NAME --clean main.py
      shell: pwsh
      env:
        APP_BASE: ${{ github.event.repository.name }}

    - name: Upload EXE as Artifact
      uses: actions/upload-artifact@v4
      with:
        name: windows-exe
        path: dist/*.exe
        retention-days: 30

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ steps.version.outputs.version }}
        name: Release v${{ steps.version.outputs.version }}
        files: dist/*.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      if: github.event_name == 'workflow_dispatch'
